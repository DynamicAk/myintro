<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Access - Authentication Required</title>

  <!--
    - favicon
  -->
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">

  <!--
    - custom css link
  -->
  <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

  <!--
    - #MAIN
  -->

  <main>

    <!--
      - #LOGIN
    -->

    <div class="login-container">
      
      <div class="login-box">
        
        <div class="login-header">
          <img src="./assets/images/logo.svg" alt="Portfolio Logo" class="login-logo">
          <h1 class="login-title">Messages Access</h1>
          <p class="login-subtitle">Please enter the password to view contact messages</p>
        </div>

        <form class="login-form" id="loginForm">
          
          <div class="input-wrapper">
            <label for="password" class="input-label">Password</label>
            <input type="password" id="password" name="password" class="login-input" placeholder="Enter password" required>
          </div>

          <div class="error-message" id="errorMessage" style="display: none;">
            Incorrect password. Please try again.
          </div>

          <button type="submit" class="login-btn">
            <span class="btn-text">Access Messages</span>
            <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
          </button>

        </form>

        <div class="login-footer">
          <p>The messages page is password protected.</p>
        </div>

      </div>

    </div>

  </main>

  <!--
    - custom js link
  -->
  <script src="./assets/js/auth.js"></script>

  <!--
    - ionicon link
  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
